config setup
    charondebug="ike 2, knl 2, cfg 0, net 0"
    uniqueids=no

conn %default
    keyexchange=ikev2
    authby=secret
    ikelifetime=60m
    lifetime=20m
    margintime=3m
    keyingtries=%forever
    rekey=yes
    dpddelay=10s
    dpdtimeout=30s
    dpdaction=restart

conn site-to-site
    left=100.64.0.20
    leftid=@site-b
    leftsubnet=100.64.2.0/24
    right=100.64.0.10
    rightid=@site-a
    rightsubnet=100.64.1.0/24
    ike=aes256-sha256-modp2048!
    esp=aes256-sha256!
    forceencaps=yes
    auto=add
